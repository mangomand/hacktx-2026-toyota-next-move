name: iOS checks

on:
  pull_request:
  push:
    branches:
      - main
      - feat/ar-scan-pulse

jobs:
  swift:
    name: Swift tests and build
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Select Swift toolchain
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0'
      - name: Run tests
        run: swift test --package-path ios
      - name: Build CaptureDemo
        run: swift build --package-path ios --product CaptureDemo
